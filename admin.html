<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kouim Luxury - لوحة التحكم</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <input type="password" id="admin-password" placeholder="أدخل كلمة السر">
            <button onclick="loginAdmin()">دخول</button>
        </div>
    </div>

    <div id="admin-dashboard" class="dashboard-container" style="display: none;">
        <header>
            <h1>لوحة تحكم متجر Kouim Luxury</h1>
            <button onclick="logoutAdmin()" class="logout-btn">تسجيل الخروج</button>
        </header>

        <section class="add-section">
            <h2>إضافة منتج جديد</h2>
            <form id="add-product-form" onsubmit="addProduct(event)">
                <input type="text" id="p-name" placeholder="اسم المنتج (مثلاً: Sneaker Casual)" required>
                <input type="number" id="p-price" placeholder="السعر (DA)" required>
                <input type="text" id="p-image" placeholder="رابط الصورة (Image URL)" required>
                <input type="text" id="p-sizes" placeholder="المقاسات (مثلاً: 40, 41, 42)" required>
                <button type="submit" class="save-btn">حفظ وإضافة المنتج</button>
            </form>
        </section>

        <section class="products-list-section">
            <h2>المنتجات الحالية في المتجر</h2>
            <div id="admin-products-list"></div>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
