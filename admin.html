<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إضافة منتج</title>
    <link rel="stylesheet" href="admin.css">
    <!-- استدعاء مكتبة Supabase الرسمية من CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="admin-container">
        <h2>لوحة تحكم المشرف - إضافة منتج جديد</h2>
        
        <form id="productForm">
            <div class="form-group">
                <label for="productName">اسم المنتج:</label>
                <input type="text" id="productName" required>
            </div>

            <div class="form-group">
                <label for="productSize">المقاسات المتاحة:</label>
                <input type="text" id="productSize" placeholder="مثال: S, M, L, XL" required>
            </div>

            <div class="form-group">
                <label for="productImage">صورة المنتج:</label>
                <input type="file" id="productImage" accept="image/*" required>
            </div>

            <button type="submit" id="submitBtn">إضافة المنتج</button>
        </form>

        <p id="message" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script src="admin.js"></script>
</body>
</html>
