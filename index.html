<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kouim Luxury | Boutique en Ligne</title>
    <style>
        /* تنسيقات أساسية للمتجر */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #000;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        nav a:hover {
            color: #000;
        }
        .cart-button {
            background: #000;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-button b {
            background: #fff;
            color: #000;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 12px;
        }
        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h1.section-title {
            margin-bottom: 20px;
            font-size: 24px;
        }
        /* شبكة المنتجات */
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body>

    <!-- الهيدر وشريط التنقل -->
    <header>
        <div class="logo">KOUIM</div>
        <nav>
            <a href="#">Accueil</a>
            <a href="#">Collection</a>
            <a href="#">À propos</a>
            <a href="#">Contact</a>
        </nav>
        <button class="cart-button">
            🛒 <span>Panier</span>
            <b id="cart-count">0</b>
        </button>
    </header>

    <!-- المحتوى الرئيسي وعرض المنتجات -->
    <main>
        <h1 class="section-title">Notre Collection</h1>
        <div id="products-container">
            <!-- سيتم جلب المنتجات وأزرار المقاسات ديناميكياً هنا عبر script.js -->
        </div>
    </main>

    <!-- استدعاء ملف الجافا سكربت الخارجي -->
    <script src="script.js"></script>
</body>
</html>
