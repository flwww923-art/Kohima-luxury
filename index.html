<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kouim Luxury | Boutique en Ligne</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
        }
        header {
            background: #1a1a1a;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
        }
        .logo span {
            color: #d4af37;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #fff;
        }
        .cart-button {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-button b {
            background: #000;
            color: #fff;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        /* البانر الترحيبي */
        .hero-banner {
            background: #1a1a1a;
            padding: 60px 30px;
            border-bottom: 1px solid #333;
            margin-bottom: 40px;
            text-align: center;
        }
        .hero-banner h1 {
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 900;
            color: #fff;
        }
        .hero-banner p {
            font-size: 16px;
            color: #aaa;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        main {
            max-width: 1200px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }
        .section-title {
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* شبكة المنتجات */
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        /* تذييل الصفحة (Footer) */
        footer {
            background: #1a1a1a;
            padding: 25px 40px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 60px;
        }
        .footer-logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
        }
        .footer-logo span {
            color: #d4af37;
        }
        .footer-info {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">KOUIM <span>LUXURY</span></div>
        <nav>
            <a href="#">Shop the drop</a>
            <a href="#">Our point of view</a>
            <a href="#">How to order</a>
        </nav>
        <button class="cart-button">
            🛒 <span>Panier</span>
            <b id="cart-count">0</b>
        </button>
    </header>

    <section class="hero-banner">
        <h1>MOVE DIFFERENT.</h1>
        <p>لماذا تختارنا؟ نحن نقدم لكم أجمل وأفخم المنتجات بجودة عالية وتصميمات عصرية تلبي تطلعاتكم وتناسب أذواقكم الرفيعة.</p>
    </section>

    <main>
        <h2 class="section-title">THE DROP.</h2>
        <div id="products-container">
            </div>
    </main>

    <footer>
        <div class="footer-logo">KOUIM <span>LUXURY</span></div>
        <div class="footer-info">
            Ain Naadja, Alger - <span style="color: #fff; font-weight: bold;">0541429664</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
